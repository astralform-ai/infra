name: Build and upload images

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-images:
    name: Build and upload images to the ${{ matrix.environment }} environment
    # `ci-builder` was never a registered runner — it came with the upstream this repo
    # forks — and NO self-hosted label works here either: this repository is a PUBLIC FORK,
    # and GitHub does not schedule self-hosted runners for those. Every run before this sat
    # `status: queued` with `runner_name: null` forever, which is what a job looks like when
    # its label can never match. `ubuntu-latest` is the runner that does schedule, it carries docker
    # and the buildx plugin, and minutes are free for public repositories.
    # The job installs its own toolchain rather than assuming one, and bounds itself so a
    # wedged build cannot hold a runner for GitHub's 360-minute default.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The first step authenticates to Infisical with `vars.INFISICAL_MACHINE_IDENTITY_ID`,
    # a value this org does not carry (no repository here has it, and the org's three
    # variables are API/AUTH base URLs and CORS). Without this gate every merge would run
    # and fail on `Missing identity ID for OIDC auth`, which is a red X that says nothing
    # about the merge. Skipped says the same thing honestly, and the workflow starts
    # working the moment the variable exists.
    if: vars.INFISICAL_MACHINE_IDENTITY_ID != ''
    strategy:
      fail-fast: false
      matrix:
        environment:
          - staging
          - foxtrot
          - juliett
          - tango
    environment: ${{ matrix.environment }}
    concurrency:
      group: build-images-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pull deployment secrets into temporary file
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: "infra-deployment"
          env-slug: ${{ matrix.environment }}
          export-type: "file"
          file-output-path: "/.env.infisical"

      - name: Load deployment environment
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          echo "${ENVIRONMENT}" > .last_used_env
          cat .env.infisical | sed "s/='\(.*\)'$/=\1/g" > ".env.${ENVIRONMENT}"

          set -a
          . ".env.${ENVIRONMENT}"
          set +a

          echo "GCP_REGION=${GCP_REGION}" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_ID=${GCP_PROJECT_ID}" >> "$GITHUB_ENV"
          echo "GH_WORKLOAD_IDENTITY_PROVIDER=${GH_WORKLOAD_IDENTITY_PROVIDER}" >> "$GITHUB_ENV"

      - name: Load runtime environment
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: "infra-deployment-env"
          env-slug: ${{ matrix.environment }}
          export-type: "env"

      - name: Free disk space
        # Ten image builds run sequentially in this one job, plus the Cloud SDK, buildkit's
        # buildkitd image and two Go caches — against a runner with ~14 GB free. The failure
        # mode is not a clean error: if the filesystem fills after some pushes, the job dies
        # having published a partial set of `:${COMMIT_SHA}` tags for the commit. Nothing here
        # needs the preinstalled Android/Dotnet/GHC stacks, so they go first.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Setup Service Account
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GH_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # `go.work`, not `go.mod`: the root has no go.mod — the 13 modules live under
          # packages/* and tests/integration, and go.work pins the toolchain. The same
          # pair pr-tests-arm64.yml uses, cache off included, because setup-go's cache
          # step looks for a dependency file at the workspace root and finds none.
          go-version-file: go.work
          cache: false

      - name: Set up Docker Buildx
        # Three targets shell out to `docker buildx` (api, client-proxy,
        # docker-reverse-proxy). The runner image happens to bundle buildx, but Docker
        # Engine does not ship it — self-host.md names Buildx as "required by make
        # build-and-upload targets" specifically, where Go and Docker are general host
        # prerequisites — so this pins a known buildx rather than inheriting whatever the
        # image carries.
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker
        env:
          GCP_REGION: ${{ env.GCP_REGION }}
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          DOCKER_AUTH_BASE64="$(echo -n "{\"username\":\"oauth2accesstoken\",\"password\":\"$ACCESS_TOKEN\"}" | base64 -w 0)"

          echo "::add-mask::$DOCKER_AUTH_BASE64"
          echo "DOCKER_AUTH_BASE64=${DOCKER_AUTH_BASE64}" >> "$GITHUB_ENV"

      - name: Build and upload images
        env:
          AUTO_CONFIRM_DEPLOY: true
          ENVD_UPLOAD_MODE: versioned
        run: make build-and-upload

      - name: Promote envd in staging
        if: ${{ matrix.environment == 'staging' }}
        env:
          ENVD_COMMIT_SHA: ${{ github.sha }}
        run: make -C packages/envd promote
